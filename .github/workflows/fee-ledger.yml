name: Fee Ledger

# Twice-hourly nudge (GitHub drops or delays scheduled runs, and the first hourly slot never fired, so there are two chances an hour) that keeps the stored record of Aero gauge fee releases current (Base, Ethereum, OP). Public RPCs only serve event logs
# about 5.5 hours back, so the multi-day fee pace on the site depends on this running at least every few hours.
# The endpoint is public and does nothing if the record was updated in the last 20 minutes.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Update the fee records
        run: |
          for chain in 8453 1 10; do
            curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
              "https://aeroallocator.app/api/gauge-fees/ingest?chain=$chain"
            echo
          done
